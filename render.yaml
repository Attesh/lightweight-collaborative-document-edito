services:
  - type: web
    name: docs-editor
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npx next build
    startCommand: npx prisma migrate deploy && npx tsx prisma/seed.ts && npm start
    envVars:
      - key: DATABASE_URL
        value: file:/opt/render/project/src/data/prod.db
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

# Render's free instance type does not support persistent disks (that requires a paid
# "Starter" instance or higher). Without a disk, the SQLite file above lives on the
# container's local filesystem: it survives restarts and sleep/wake, but is wiped on every
# new deploy (the seed script re-runs on startCommand, so the seeded accounts always come
# back — any real documents created since the last deploy would not).
#
# To get true cross-deploy persistence, upgrade the service to a paid instance and add:
#
# disk:
#   name: data
#   mountPath: /opt/render/project/src/data
#   sizeGB: 1
